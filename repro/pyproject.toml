[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dartsdet"
version = "0.1.0"
description = "DARTS: locally most powerful target detection with score-matched background models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.13", "scikit-learn>=1.5", "torch>=2.4"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["dartsdet"]

[tool.pytest.ini_options]
testpaths = ["dartsdet", "experiments"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C90", "SIM", "ARG", "ERA", "NPY", "PLR0913", "PLR0915",
          "ANN001", "ANN201", "RUF100"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 7
max-statements = 40
